# Uji skill argument-battle-royale, lalu terbitkan zip yang siap diunggah ke
# Claude.ai sebagai aset release "skill-latest" setiap kali main berubah.
# Tautan unduhan tetap:
#   https://github.com/<pemilik>/<repo>/releases/download/skill-latest/argument-battle-royale.zip
name: Paket skill

on:
  push:
    branches: [main]
    paths:
      - ".claude/skills/argument-battle-royale/**"
      - ".github/scripts/package_skill.py"
      - ".github/workflows/skill-package.yml"
  pull_request:
    paths:
      - ".claude/skills/argument-battle-royale/**"
      - ".github/scripts/package_skill.py"
      - ".github/workflows/skill-package.yml"
  workflow_dispatch:

concurrency:
  group: skill-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Uji engine end-to-end
        run: python3 .claude/skills/argument-battle-royale/scripts/selftest.py

      - name: Bangun zip untuk Claude.ai
        run: python3 .github/scripts/package_skill.py dist

      - name: Simpan zip sebagai artifact workflow
        uses: actions/upload-artifact@v4
        with:
          name: argument-battle-royale
          path: dist/argument-battle-royale.zip

      - name: Terbitkan ke release skill-latest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Skill argument-battle-royale siap diunggah ke Claude.ai (Skills → Upload a skill).
          Dibangun otomatis dari commit ${GITHUB_SHA::7}. Jangan pakai tombol Code → Download ZIP: zip itu berisi seluruh repo dan akan ditolak Claude.ai."
          if gh release view skill-latest >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/skill-latest" -f sha="$GITHUB_SHA" -F force=true
            gh release edit skill-latest --notes "$notes"
          else
            gh release create skill-latest --target "$GITHUB_SHA" --title "Skill untuk Claude.ai" --notes "$notes"
          fi
          gh release upload skill-latest dist/argument-battle-royale.zip --clobber
